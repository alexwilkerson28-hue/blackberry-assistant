<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BlackBerry Assistant Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* ═══════════════════════════════════
       SCREEN SYSTEM — only one visible
    ═══════════════════════════════════ */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }
    .screen.hidden { opacity: 0; pointer-events: none; }

    /* ═══════════════════════════════════
       GRID SCREEN
    ═══════════════════════════════════ */
    #grid-screen {
      background: radial-gradient(ellipse at 50% 40%, #0d0d18 0%, #000 70%);
    }

    .tile-grid {
      display: grid;
      /* Match original: wide clock tile + two narrow columns */
      grid-template-columns: 200px 160px 160px;
      grid-template-rows: 130px 130px;
      gap: 3px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px 14px;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      position: relative;
      overflow: hidden;
      transition: filter 0.12s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .tile:hover  { filter: brightness(1.18); }
    .tile:active { transform: scale(0.97); filter: brightness(1.3); }

    /* Exact colours from screenshot */
    .t-clock      { background: #6a8c3f; grid-row: span 2; align-items: center; justify-content: center; }
    .t-restaurant { background: #738f3e; }
    .t-search     { background: #1877c8; }
    .t-sports     { background: #8c2222; }
    .t-tickets    { background: #952626; }

    /* ── Clock tile ── */
    .clock-inner {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      pointer-events: none;
    }
    .clock-svg { width: 64px; height: 64px; }
    .clock-digital {
      font-size: 14px; font-weight: 300; letter-spacing: 2px;
      color: rgba(255,255,255,0.9);
    }
    .clock-dow {
      font-size: 11px; font-weight: 400; letter-spacing: 1px;
      text-transform: uppercase; color: rgba(255,255,255,0.65);
      margin-top: -4px;
    }

    /* ── Small tile icons & labels ── */
    .tile-top {
      position: absolute; top: 12px; left: 14px;
    }
    .tile-icon-svg { width: 28px; height: 28px; }
    .tile-dot {
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(255,255,255,0.85);
    }
    .tile-label {
      font-size: 13px; font-weight: 400; line-height: 1.25;
      color: #fff;
    }

    /* Sports tile — daily label */
    .sport-day   { font-size: 9px; opacity: .6; text-transform: uppercase; letter-spacing: .5px; }
    .sport-name  { font-size: 13px; font-weight: 600; line-height: 1.2; }
    .sport-league{ font-size: 10px; opacity: .65; }

    /* ── Search bar ── */
    .search-row {
      margin-top: 22px;
      width: 523px; /* matches tile grid width */
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 6px;
      display: flex; align-items: center; gap: 0;
      position: relative;
    }
    .search-row input {
      flex: 1; background: transparent; border: none; outline: none;
      font-family: inherit; font-size: 16px; font-style: italic;
      font-weight: 300; color: rgba(255,255,255,.55);
      caret-color: #1877c8;
    }
    .search-row input::placeholder { color: rgba(255,255,255,.0); }
    .search-row input:focus { color: rgba(255,255,255,.85); font-style: normal; }
    /* "Type here to get started" fake placeholder matching original exactly */
    .search-placeholder {
      position: absolute; left: 0; top: 0; bottom: 0;
      display: flex; align-items: center;
      pointer-events: none;
      font-size: 16px; font-style: italic; font-weight: 300;
      color: rgba(255,255,255,.55);
      white-space: nowrap;
    }
    .search-placeholder span {
      background: #1877c8;
      color: #fff;
      padding: 1px 3px;
      font-style: italic;
    }
    .search-go {
      background: none; border: none; color: rgba(255,255,255,.4);
      cursor: pointer; font-size: 18px; padding: 0 4px;
      transition: color .15s;
    }
    .search-go:hover { color: #fff; }

    /* ── Mic button ── matches original circle exactly ── */
    .mic-wrap {
      margin-top: 60px;
    }
    .mic-btn {
      width: 72px; height: 72px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.7);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .2s, background .2s, transform .1s;
    }
    .mic-btn:hover  { border-color: #fff; background: rgba(255,255,255,.06); }
    .mic-btn:active { transform: scale(.95); }
    .mic-icon-svg { width: 26px; height: 26px; fill: rgba(255,255,255,0.85); }

    /* ═══════════════════════════════════
       RESULT SCREEN  (tile click)
    ═══════════════════════════════════ */
    #result-screen {
      background: radial-gradient(ellipse at 50% 40%, #0d0d18 0%, #000 70%);
      flex-direction: column;
      gap: 0;
    }

    .result-header {
      display: flex; align-items: center; gap: 16px;
      width: 100%; max-width: 600px;
      padding: 0 32px 32px;
    }
    .result-icon-circle {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .result-title { font-size: 20px; font-weight: 300; color: rgba(255,255,255,.9); }

    .result-body {
      width: 100%; max-width: 600px;
      padding: 0 32px;
      font-size: 14px; color: rgba(255,255,255,.6);
      line-height: 1.7;
    }

    .result-input-row {
      margin-top: 24px;
      width: 100%; max-width: 600px;
      padding: 0 32px;
      border-bottom: 1px solid rgba(255,255,255,.2);
      padding-bottom: 6px;
      font-size: 14px; color: rgba(255,255,255,.45);
      font-style: italic;
    }

    .result-open-btn {
      margin-top: 32px;
      padding: 10px 28px;
      background: transparent;
      border: 1px solid rgba(255,255,255,.35);
      color: rgba(255,255,255,.8);
      font-size: 14px; font-family: inherit;
      cursor: pointer; letter-spacing: .5px;
      transition: background .2s, border-color .2s;
    }
    .result-open-btn:hover { background: rgba(255,255,255,.08); border-color: #fff; }

    .back-btn {
      position: absolute; bottom: 28px; left: 28px;
      width: 44px; height: 44px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.2);
      color: rgba(255,255,255,.7);
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .back-btn:hover { background: rgba(255,255,255,.14); }

    /* ═══════════════════════════════════
       MIC OVERLAY  — BlackBerry style
    ═══════════════════════════════════ */
    #mic-screen {
      background: #07080f;
      z-index: 100;
    }

    /* Geometric faceted background */
    .geo { position: absolute; inset: 0; overflow: hidden; }
    .geo::before {
      content: '';
      position: absolute;
      width: 0; height: 0;
      border-left: 120vw solid transparent;
      border-top: 75vh solid #0c1526;
      top: 0; left: -10vw;
    }
    .geo::after {
      content: '';
      position: absolute;
      width: 0; height: 0;
      border-right: 55vw solid transparent;
      border-top: 60vh solid #16092a;
      top: 0; right: 0;
      opacity: .75;
    }
    .geo .ga {
      position: absolute;
      width: 0; height: 0;
      border-left: 100vw solid transparent;
      border-bottom: 55vh solid #080e1e;
      bottom: 0; left: 0;
    }
    .geo .gb {
      position: absolute;
      width: 0; height: 0;
      border-left: 60vw solid transparent;
      border-right: 60vw solid transparent;
      border-bottom: 50vh solid #0d1a2e;
      top: 8vh; left: -20vw;
      opacity: .5;
    }
    .geo .gc {
      position: absolute;
      width: 0; height: 0;
      border-right: 45vw solid transparent;
      border-bottom: 70vh solid #110820;
      bottom: 0; right: 0;
      opacity: .6;
    }

    /* Blue pulsing circle */
    .mic-orb {
      position: relative; z-index: 2;
      width: 130px; height: 130px; border-radius: 50%;
      background: #1daae0;
      display: flex; align-items: center; justify-content: center;
      animation: orbPulse 1.5s ease-in-out infinite;
    }
    @keyframes orbPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(29,170,224,.5); }
      50%      { box-shadow: 0 0 0 24px rgba(29,170,224,0); }
    }

    /* Animated wave inside orb */
    .orb-wave { width: 76px; height: 30px; }
    .wave-line {
      fill: none; stroke: #fff;
      stroke-width: 2.8; stroke-linecap: round;
    }

    .mic-status {
      position: relative; z-index: 2;
      margin-top: 28px;
      font-size: 14px; font-weight: 300;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: rgba(255,255,255,.6);
    }
    .mic-words {
      position: relative; z-index: 2;
      margin-top: 14px;
      font-size: 18px; font-weight: 300;
      color: #fff; min-height: 28px;
      max-width: 80vw; text-align: center;
    }
    .mic-close-hint {
      position: absolute; bottom: 36px; z-index: 3;
      font-size: 12px; color: rgba(255,255,255,.3);
      letter-spacing: 1.5px; cursor: pointer;
      text-transform: uppercase;
      transition: color .2s;
    }
    .mic-close-hint:hover { color: rgba(255,255,255,.65); }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════
       SCREEN 1 — GRID (main screen)
  ══════════════════════════════════ -->
  <div class="screen" id="grid-screen">

    <div class="tile-grid">

      <!-- CLOCK — tall tile -->
      <div class="tile t-clock" onclick="openLink('https://www.timeanddate.com/calendar/')">
        <div class="clock-inner">
          <svg class="clock-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <!-- ring -->
            <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5"/>
            <!-- hour hand -->
            <line id="hh" x1="32" y1="32" x2="32" y2="16" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round"/>
            <!-- minute hand -->
            <line id="hm" x1="32" y1="32" x2="32" y2="10" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"/>
            <!-- center dot -->
            <circle cx="32" cy="32" r="2.5" fill="#fff"/>
          </svg>
          <div class="clock-digital" id="clockTime">00:00</div>
          <div class="clock-dow"    id="clockDow">Monday</div>
        </div>
      </div>

      <!-- FIND A RESTAURANT -->
      <div class="tile t-restaurant" onclick="goTo('restaurant')">
        <div class="tile-top">
          <div class="tile-dot"></div>
        </div>
        <div class="tile-label">Find a<br>restaurant</div>
      </div>

      <!-- SEARCH INTERNET -->
      <div class="tile t-search" onclick="goTo('search')">
        <div class="tile-top">
          <svg class="tile-icon-svg" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="8" stroke="rgba(255,255,255,0.9)" stroke-width="2.2"/>
            <line x1="18" y1="18" x2="25" y2="25" stroke="rgba(255,255,255,0.9)" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="tile-label">Search Internet</div>
      </div>

      <!-- CHECK SPORTS — daily rotating -->
      <div class="tile t-sports" id="sports-tile" onclick="goTo('sports')">
        <div class="tile-top">
          <svg class="tile-icon-svg" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="14" r="10" stroke="rgba(255,255,255,0.85)" stroke-width="2"/>
            <line x1="14" y1="4" x2="14" y2="24" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>
            <path d="M4 14 Q14 8 24 14 Q14 20 4 14Z" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" fill="none"/>
          </svg>
        </div>
        <div class="sport-day"    id="sport-day">Today</div>
        <div class="sport-name"   id="sport-name">Check sports</div>
        <div class="sport-league" id="sport-league"></div>
      </div>

      <!-- CHECK TICKETS -->
      <div class="tile t-tickets" onclick="goTo('tickets')">
        <div class="tile-top">
          <svg class="tile-icon-svg" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="7" width="22" height="15" rx="2" stroke="rgba(255,255,255,0.85)" stroke-width="2"/>
            <line x1="3" y1="12" x2="25" y2="12" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>
            <line x1="9" y1="7" x2="9" y2="5" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"/>
            <line x1="19" y1="7" x2="19" y2="5" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="tile-label">Check tickets</div>
      </div>

    </div><!-- /tile-grid -->

    <!-- SEARCH BAR -->
    <div class="search-row">
      <div class="search-placeholder" id="searchPlaceholder">
        Type here to get <span>started</span>
      </div>
      <input type="text" id="searchInput"
        oninput="onSearchInput(this.value)"
        onkeydown="if(event.key==='Enter') doSearch()" />
      <button class="search-go" onclick="doSearch()">&#8250;</button>
    </div>

    <!-- MIC BUTTON -->
    <div class="mic-wrap">
      <button class="mic-btn" onclick="openMic()" aria-label="Voice input">
        <svg class="mic-icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-6 9a6 6 0 0 0 12 0h2a8 8 0 0 1-7 7.93V21h-2v-3.07A8 8 0 0 1 4 10h2z"/>
        </svg>
      </button>
    </div>

  </div><!-- /#grid-screen -->


  <!-- ══════════════════════════════════
       SCREEN 2 — RESULT
  ══════════════════════════════════ -->
  <div class="screen hidden" id="result-screen">

    <div class="result-header">
      <div class="result-icon-circle" id="result-icon"></div>
      <div class="result-title" id="result-title">Find a restaurant</div>
    </div>

    <div class="result-body" id="result-body">
      Looking for restaurants near you…
    </div>

    <div class="result-input-row" id="result-input-row">
      Find a restaurant nearby
    </div>

    <button class="result-open-btn" id="result-open-btn" onclick="openResult()">
      Open ›
    </button>

    <!-- back arrow — matches original screenshot -->
    <button class="back-btn" onclick="goBack()" aria-label="Back">&#8249;</button>

  </div><!-- /#result-screen -->


  <!-- ══════════════════════════════════
       SCREEN 3 — MIC OVERLAY
  ══════════════════════════════════ -->
  <div class="screen hidden" id="mic-screen">

    <div class="geo">
      <div class="ga"></div>
      <div class="gb"></div>
      <div class="gc"></div>
    </div>

    <div class="mic-orb">
      <svg class="orb-wave" viewBox="0 0 76 30" xmlns="http://www.w3.org/2000/svg">
        <path class="wave-line" id="wavePath"
          d="M4,15 C10,6 16,24 26,15 C36,6 42,24 52,15 C60,6 66,24 72,15"/>
      </svg>
    </div>

    <div class="mic-status" id="micStatus">Listening…</div>
    <div class="mic-words"  id="micWords"></div>

    <div class="mic-close-hint" onclick="closeMic()">✕ &nbsp; tap to close</div>

  </div><!-- /#mic-screen -->


  <script>
    /* ════════════════════════════
       CLOCK
    ════════════════════════════ */
    const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

    function updateClock() {
      const now = new Date();
      const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
      const hDeg = (h % 12) * 30 + m * 0.5;
      const mDeg = m * 6 + s * 0.1;

      // Rotate SVG lines around centre (32,32)
      const hRad = (hDeg - 90) * Math.PI / 180;
      const mRad = (mDeg - 90) * Math.PI / 180;
      const hLen = 16, mLen = 22;

      document.getElementById('hh').setAttribute('x2', 32 + Math.cos(hRad) * hLen);
      document.getElementById('hh').setAttribute('y2', 32 + Math.sin(hRad) * hLen);
      document.getElementById('hm').setAttribute('x2', 32 + Math.cos(mRad) * mLen);
      document.getElementById('hm').setAttribute('y2', 32 + Math.sin(mRad) * mLen);

      document.getElementById('clockTime').textContent =
        h.toString().padStart(2,'0') + ':' + m.toString().padStart(2,'0');
      document.getElementById('clockDow').textContent = DAYS[now.getDay()];
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* ════════════════════════════
       DAILY SPORTS
    ════════════════════════════ */
    const SPORTS = [
      { day:'Sunday',    name:'NFL Scores',         league:'All Games',             url:'https://www.nfl.com/scores/' },
      { day:'Monday',    name:'Monday Night NFL',   league:'NFL Football',          url:'https://www.nfl.com/scores/' },
      { day:'Tuesday',   name:'NBA Standings',      league:'NBA Basketball',        url:'https://www.nba.com/standings' },
      { day:'Wednesday', name:'MLB Scores',          league:'Major League Baseball', url:'https://www.mlb.com/scores' },
      { day:'Thursday',  name:'Thursday Night NFL', league:'NFL Football',          url:'https://www.nfl.com/scores/' },
      { day:'Friday',    name:'NBA Games',           league:'NBA Basketball',        url:'https://www.nba.com/games' },
      { day:'Saturday',  name:'College Football',   league:'NCAA / ESPN',           url:'https://www.espn.com/college-football/scoreboard' },
    ];
    const todaySport = SPORTS[new Date().getDay()];
    document.getElementById('sport-day').textContent    = todaySport.day;
    document.getElementById('sport-name').textContent   = todaySport.name;
    document.getElementById('sport-league').textContent = todaySport.league;

    /* ════════════════════════════
       SCREEN TRANSITIONS
    ════════════════════════════ */
    function showScreen(id) {
      ['grid-screen','result-screen','mic-screen'].forEach(s => {
        document.getElementById(s).classList.toggle('hidden', s !== id);
      });
    }

    function goBack() { showScreen('grid-screen'); }

    /* ════════════════════════════
       TILE ACTIONS
    ════════════════════════════ */
    const TILE_DATA = {
      restaurant: {
        color: '#6a8c3f',
        iconSVG: `<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="28" cy="28" r="28" fill="#6a8c3f"/><path d="M20 16v24M20 16c0 5 6 8 6 12H14c0-4 6-7 6-12z" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M34 16v8a6 6 0 0 0 6 6v14" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="34" y1="24" x2="40" y2="24" stroke="#fff" stroke-width="2"/></svg>`,
        title: 'Find a restaurant',
        body: 'Search for the best restaurants near you on Yelp — ratings, menus, reviews, and directions.',
        inputHint: 'Find a restaurant nearby',
        url: 'https://www.yelp.com/search?find_desc=restaurants'
      },
      search: {
        color: '#1877c8',
        iconSVG: `<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="28" cy="28" r="28" fill="#1877c8"/><circle cx="24" cy="24" r="9" stroke="#fff" stroke-width="2.5"/><line x1="30" y1="30" x2="40" y2="40" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>`,
        title: 'Search Internet',
        body: 'Search the web with Google — find anything from news and weather to directions and more.',
        inputHint: 'Search the internet',
        url: 'https://www.google.com'
      },
      sports: {
        color: '#8c2222',
        iconSVG: `<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="28" cy="28" r="28" fill="#8c2222"/><circle cx="28" cy="28" r="12" stroke="#fff" stroke-width="2"/><line x1="28" y1="16" x2="28" y2="40" stroke="#fff" stroke-width="1.5"/><path d="M16 28 Q28 22 40 28 Q28 34 16 28Z" stroke="#fff" stroke-width="1.5" fill="none"/></svg>`,
        title: todaySport.name,
        body: `Today\'s featured sport: ${todaySport.league}. Check live scores, standings, and highlights.`,
        inputHint: 'Check sports scores',
        url: todaySport.url
      },
      tickets: {
        color: '#952626',
        iconSVG: `<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="28" cy="28" r="28" fill="#952626"/><rect x="12" y="18" width="32" height="20" rx="3" stroke="#fff" stroke-width="2"/><line x1="12" y1="25" x2="44" y2="25" stroke="#fff" stroke-width="1.5"/><line x1="20" y1="18" x2="20" y2="15" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="36" y1="18" x2="36" y2="15" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`,
        title: 'Check tickets',
        body: 'Find tickets for concerts, sports events, theatre, and more on Ticketmaster.',
        inputHint: 'Check event tickets',
        url: 'https://www.ticketmaster.com'
      },
    };

    let currentUrl = '';

    function goTo(key) {
      const d = TILE_DATA[key];
      document.getElementById('result-icon').innerHTML = d.iconSVG;
      document.getElementById('result-title').textContent  = d.title;
      document.getElementById('result-body').textContent   = d.body;
      document.getElementById('result-input-row').textContent = d.inputHint;
      currentUrl = d.url;
      showScreen('result-screen');
    }

    function openResult() {
      if (currentUrl) window.open(currentUrl, '_blank');
    }

    function openLink(url) { window.open(url, '_blank'); }

    /* ════════════════════════════
       SEARCH BAR
    ════════════════════════════ */
    function onSearchInput(val) {
      document.getElementById('searchPlaceholder').style.display = val ? 'none' : 'flex';
    }

    const SEARCH_LINKS = {
      taco:    'https://www.yelp.com/search?find_desc=tacos',
      pizza:   'https://www.google.com/search?q=pizza+near+me',
      restaurant: 'https://www.yelp.com/search?find_desc=restaurants',
      weather: 'https://weather.com',
      laker:   'https://www.espn.com/nba/',
      nba:     'https://www.nba.com/scores',
      nfl:     'https://www.nfl.com/scores/',
      sport:   'https://www.espn.com',
      ticket:  'https://www.ticketmaster.com',
      concert: 'https://www.ticketmaster.com',
    };

    function doSearch() {
      const val = document.getElementById('searchInput').value.trim();
      if (!val) return;
      const low = val.toLowerCase();
      for (const [k, u] of Object.entries(SEARCH_LINKS)) {
        if (low.includes(k)) { window.open(u, '_blank'); return; }
      }
      window.open('https://www.google.com/search?q=' + encodeURIComponent(val), '_blank');
    }

    /* ════════════════════════════
       MIC  +  FEMALE VOICE
    ════════════════════════════ */
    let femaleVoice  = null;
    let recognition  = null;
    let waveTimer    = null;

    function loadVoices() {
      const voices = window.speechSynthesis.getVoices();
      const prefer = ['samantha','zira','victoria','karen','moira','tessa','fiona','female'];
      for (const name of prefer) {
        const v = voices.find(x => x.name.toLowerCase().includes(name));
        if (v) { femaleVoice = v; return; }
      }
      femaleVoice = voices.find(v =>
        !/(male|david|james|mark|google uk english male)/i.test(v.name)
      ) || voices[0] || null;
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speak(text) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.voice = femaleVoice;
      u.rate  = 0.96;
      u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    }

    /* Animate wave path */
    let wavePhase = 0;
    function animateWave() {
      wavePhase += 0.12;
      const amp = 9;
      const pts = [];
      for (let x = 4; x <= 72; x += 8) {
        const y = 15 + Math.sin(wavePhase + x * 0.18) * amp;
        pts.push(`${x},${y.toFixed(1)}`);
      }
      // build smooth path
      const p = `M${pts[0]} ` + pts.slice(1).map((pt,i) => {
        const prev = pts[i].split(',');
        const cur  = pt.split(',');
        const cpx  = (parseFloat(prev[0]) + parseFloat(cur[0])) / 2;
        return `Q${cpx},${prev[1]} ${cur[0]},${cur[1]}`;
      }).join(' ');
      const el = document.getElementById('wavePath');
      if (el) el.setAttribute('d', p);
      waveTimer = requestAnimationFrame(animateWave);
    }

    function openMic() {
      showScreen('mic-screen');
      document.getElementById('micStatus').textContent = 'Listening…';
      document.getElementById('micWords').textContent  = '';
      speak("Hello! I'm listening. What can I help you with?");
      animateWave();
      startSpeech();
    }

    function closeMic() {
      showScreen('grid-screen');
      window.speechSynthesis.cancel();
      if (recognition) { try { recognition.stop(); } catch(e){} }
      if (waveTimer)   { cancelAnimationFrame(waveTimer); waveTimer = null; }
    }

    function startSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        document.getElementById('micStatus').textContent = 'Voice not supported — use Chrome';
        speak('Sorry, voice recognition needs Chrome or Edge.');
        return;
      }
      recognition = new SR();
      recognition.lang = 'en-US';
      recognition.interimResults = true;
      recognition.continuous     = false;

      recognition.onresult = e => {
        let final = '', interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) final += t; else interim += t;
        }
        document.getElementById('micWords').textContent = final || interim;
        if (final) handleVoice(final.toLowerCase().trim());
      };

      recognition.onend = () => {
        const w = document.getElementById('micWords').textContent;
        if (!w) {
          document.getElementById('micStatus').textContent = "Didn't catch that";
          speak("I didn't catch that. Please try again.");
        }
      };

      recognition.onerror = e => {
        document.getElementById('micStatus').textContent = 'Error: ' + e.error;
      };

      recognition.start();
    }

    const VOICE_CMDS = [
      { keys:['restaurant','food','eat','hungry','pizza','burger','taco','lunch','dinner'],
        say:'Opening restaurant search for you!',
        go: () => goTo('restaurant') },
      { keys:['weather','rain','temperature','forecast','hot','cold'],
        say:'Let me check the weather for you.',
        go: () => { window.open('https://weather.com','_blank'); closeMic(); } },
      { keys:['sport','nba','nfl','score','game','basketball','football','baseball','mlb'],
        say:'Opening sports scores!',
        go: () => goTo('sports') },
      { keys:['ticket','concert','event','show','venue'],
        say:'Opening Ticketmaster for tickets.',
        go: () => goTo('tickets') },
      { keys:['search','google','find','look up','internet'],
        say:'Opening a search for you.',
        go: () => goTo('search') },
      { keys:['time','clock','what time'],
        say: () => { const n=new Date(); return `It's ${n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}.`; },
        go: null },
      { keys:['hello','hi ','hey ','howdy'],
        say:'Hello! How can I help you today?',
        go: null },
    ];

    function handleVoice(text) {
      document.getElementById('micStatus').textContent = 'Got it!';
      for (const cmd of VOICE_CMDS) {
        if (cmd.keys.some(k => text.includes(k))) {
          const reply = typeof cmd.say === 'function' ? cmd.say() : cmd.say;
          speak(reply);
          document.getElementById('micWords').textContent = reply;
          if (cmd.go) {
            setTimeout(() => { closeMic(); cmd.go(); }, 1800);
          } else {
            setTimeout(closeMic, 3000);
          }
          return;
        }
      }
      speak('Searching for ' + text);
      setTimeout(() => {
        window.open('https://www.google.com/search?q=' + encodeURIComponent(text), '_blank');
        closeMic();
      }, 1400);
    }
  </script>
</body>
