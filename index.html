<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>BlackBerry Assistant Pro</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#000"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="BB Assistant"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;height:100%;background:#000;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;color:#fff;overflow:hidden;position:fixed;inset:0;-webkit-user-select:none;user-select:none;}
    .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .25s;}
    .screen.hidden{opacity:0;pointer-events:none;}

    /* ═══ AUTH SCREENS ═══ */
    #auth-screen{background:radial-gradient(ellipse at 50% 30%,#0d0d1c 0%,#000 80%);}
    .auth-box{width:90%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:16px;}
    .auth-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:8px;}
    .auth-logo svg{width:56px;height:56px;}
    .auth-logo-text{font-size:20px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.85);}
    .auth-logo-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.3);}
    .auth-tabs{display:flex;width:100%;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:4px;}
    .auth-tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:500;color:rgba(255,255,255,.35);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.5px;transition:color .2s,border-color .2s;}
    .auth-tab.active{color:#1db8e8;border-bottom-color:#1db8e8;}
    .auth-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:6px;padding:13px 16px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;}
    .auth-input:focus{border-color:#1db8e8;}
    .auth-input::placeholder{color:rgba(255,255,255,.25);}
    .auth-btn{width:100%;padding:14px;background:#1db8e8;border:none;color:#000;font-size:15px;font-family:inherit;font-weight:700;border-radius:6px;cursor:pointer;letter-spacing:.5px;transition:background .2s;}
    .auth-btn:active{background:#1a9fcc;}
    .auth-error{font-size:12px;color:#ff6b6b;text-align:center;min-height:16px;}
    .auth-divider{width:100%;text-align:center;font-size:11px;color:rgba(255,255,255,.2);letter-spacing:1px;}
    .auth-free-badge{background:rgba(29,184,232,.15);border:1px solid rgba(29,184,232,.3);border-radius:20px;padding:6px 16px;font-size:11px;color:#1db8e8;letter-spacing:1px;}

    /* ═══ MAIN SCREEN ═══ */
    #grid-screen{background:radial-gradient(ellipse at 50% 30%,#0d0d14 0%,#000 75%);}

    /* greeting bar */
    .greeting-bar{
      width:100%;max-width:700px;
      padding:10px 16px 6px;
      display:flex;align-items:center;justify-content:space-between;
      flex-shrink:0;
    }
    .greeting-left{display:flex;align-items:center;gap:10px;}
    .bb-logo svg{width:28px;height:28px;}
    .greeting-text{font-size:clamp(13px,3vw,16px);font-weight:300;color:rgba(255,255,255,.85);}
    .greeting-name{color:#1db8e8;font-weight:600;}
    .settings-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.4);font-size:20px;transition:color .2s,transform .3s;padding:4px;}
    .settings-btn:hover{color:#fff;transform:rotate(45deg);}

    /* tile grid */
    .tile-grid{
      display:grid;
      grid-template-columns:52vw 24vw 24vw;
      grid-template-rows:28vw 28vw;
      gap:2px;width:100vw;max-width:700px;
    }
    .tile{display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;cursor:pointer;color:#fff;position:relative;overflow:hidden;transition:filter .12s,transform .1s;-webkit-tap-highlight-color:transparent;}
    .tile:active{transform:scale(.97);filter:brightness(1.3);}
    .tile-icon-area{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);}
    .tile-icon-area svg{width:min(52px,10vw);height:min(52px,10vw);}
    .tile-label{font-size:clamp(11px,2.5vw,14px);font-weight:400;line-height:1.25;z-index:1;}
    .t-alarm{grid-row:span 2;}
    .t-alarm .tile-icon-area{top:38%;}
    .t-alarm .tile-label{font-size:clamp(13px,3vw,16px);}
    .sport-day{font-size:9px;opacity:.6;text-transform:uppercase;letter-spacing:.5px;}
    .sport-name{font-size:clamp(11px,2.5vw,13px);font-weight:600;line-height:1.2;}
    .sport-league{font-size:10px;opacity:.65;}

    /* search bar */
    .search-row{width:100vw;max-width:700px;background:rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.15);padding:11px 14px;display:flex;align-items:center;gap:8px;position:relative;flex-shrink:0;}
    .search-ph{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:clamp(14px,3.5vw,17px);font-style:italic;font-weight:300;color:rgba(255,255,255,.35);white-space:nowrap;pointer-events:none;}
    .search-row input{flex:1;background:transparent;border:none;outline:none;font-family:inherit;font-size:clamp(14px,3.5vw,17px);font-style:italic;font-weight:300;color:rgba(255,255,255,.85);caret-color:#1db8e8;}
    .search-row input::placeholder{color:transparent;}
    .search-row input:focus{font-style:normal;}
    .search-go{background:#1db8e8;border:none;color:#000;cursor:pointer;font-size:16px;font-weight:700;padding:6px 12px;border-radius:4px;transition:background .15s;}
    .search-go:active{background:#1a9fcc;}

    /* mic */
    .mic-wrap{margin-top:clamp(30px,6vw,60px);}
    .mic-btn{width:clamp(60px,13vw,72px);height:clamp(60px,13vw,72px);border-radius:50%;border:2px solid rgba(255,255,255,.6);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s,background .15s;}
    .mic-btn:active{transform:scale(.95);}
    .mic-btn svg{width:clamp(22px,5vw,26px);height:clamp(22px,5vw,26px);fill:rgba(255,255,255,.85);}
    .info-btn{position:absolute;bottom:14px;right:14px;width:34px;height:34px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);font-size:16px;font-style:italic;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;}

    /* ═══ RESULT SCREEN ═══ */
    #result-screen{background:radial-gradient(ellipse at 50% 30%,#0d0d1c 0%,#000 72%);justify-content:flex-start;padding:0;overflow:hidden;}
    .result-topbar{width:100%;flex-shrink:0;background:rgba(0,0,0,.75);border-bottom:1px solid rgba(255,255,255,.1);padding:10px 14px;display:flex;align-items:center;gap:10px;}
    .back-btn{width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:28px;font-weight:200;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent;transition:background .15s;}
    .back-btn:active{background:rgba(255,255,255,.25);}
    .topbar-icon{width:36px;height:36px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .result-title{font-size:clamp(14px,3.5vw,19px);font-weight:300;color:rgba(255,255,255,.9);flex:1;}
    .result-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;padding:14px 4% 40px;}
    .result-content{width:100%;max-width:600px;margin:0 auto;background:rgba(255,255,255,.04);border:.5px solid rgba(255,255,255,.1);border-radius:6px;padding:16px 18px;font-size:clamp(12px,3vw,14px);color:rgba(255,255,255,.75);line-height:1.8;}
    .rc-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:.5px solid rgba(255,255,255,.08);}
    .rc-item:last-child{border-bottom:none;}
    .rc-num{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:2px;}
    .rc-name{font-size:clamp(13px,3vw,15px);font-weight:500;color:#fff;}
    .rc-sub{font-size:clamp(11px,2.5vw,13px);color:rgba(255,255,255,.5);margin-top:3px;}
    .loading{opacity:.5;font-style:italic;animation:blink 1s infinite;}
    @keyframes blink{0%,100%{opacity:.5}50%{opacity:.15}}
    .ai-answer{font-size:clamp(13px,3vw,15px);color:rgba(255,255,255,.88);line-height:1.8;white-space:pre-wrap;}
    .ai-answer strong{color:#1db8e8;}

    /* ═══ MIC / AI SCREEN ═══ */
    #mic-screen{background:#07080f;z-index:100;}
    .geo{position:absolute;inset:0;overflow:hidden;}
    .geo::before{content:'';position:absolute;width:0;height:0;border-style:solid;border-width:100vh 105vw 0 0;border-color:#0b1422 transparent transparent transparent;top:0;left:0;}
    .geo::after{content:'';position:absolute;width:0;height:0;border-style:solid;border-width:0 60vw 55vh 0;border-color:transparent #1a0b2e transparent transparent;top:0;right:0;opacity:.8;}
    .geo .g1{position:absolute;width:0;height:0;border-style:solid;border-width:0 0 60vh 110vw;border-color:transparent transparent #000 transparent;bottom:0;left:0;}
    .geo .g2{position:absolute;width:0;height:0;border-style:solid;border-width:45vh 55vw 0 55vw;border-color:#0d1a30 transparent transparent transparent;top:5vh;left:-10vw;opacity:.6;}
    .geo .g3{position:absolute;width:0;height:0;border-style:solid;border-width:0 0 50vh 50vw;border-color:transparent transparent #150820 transparent;bottom:0;right:0;opacity:.65;}
    .mic-orb{position:relative;z-index:2;width:clamp(100px,26vw,130px);height:clamp(100px,26vw,130px);border-radius:50%;background:#1db8e8;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(29,184,232,.5);animation:orbPulse 1.6s ease-in-out infinite;cursor:pointer;}
    @keyframes orbPulse{0%,100%{box-shadow:0 0 0 0 rgba(29,184,232,.45);}50%{box-shadow:0 0 0 18px rgba(29,184,232,0);}}
    .orb-wave{width:60%;height:auto;}
    .ai-chat{position:relative;z-index:2;width:90%;max-width:480px;max-height:38vh;overflow-y:auto;margin-top:16px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;}
    .ai-msg{padding:10px 14px;border-radius:18px;font-size:clamp(12px,3vw,14px);line-height:1.5;max-width:88%;animation:fadeUp .2s ease both;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .ai-msg.assistant{background:#1db8e8;color:#000;align-self:center;border-radius:20px;font-weight:500;text-align:center;}
    .ai-msg.user{background:rgba(255,255,255,.12);color:#fff;align-self:flex-end;}
    .ai-msg.thinking{background:rgba(29,184,232,.15);color:rgba(255,255,255,.5);align-self:center;font-style:italic;font-size:12px;}
    .mic-status{position:relative;z-index:2;margin-top:12px;font-size:11px;font-weight:300;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.45);}
    .mic-close-hint{position:absolute;bottom:24px;z-index:3;font-size:11px;color:rgba(255,255,255,.22);letter-spacing:1.5px;cursor:pointer;text-transform:uppercase;}

    /* ═══ SETTINGS SCREEN ═══ */
    #settings-screen{background:radial-gradient(ellipse at 50% 30%,#0d0d1c 0%,#000 70%);justify-content:flex-start;padding:0;overflow:hidden;z-index:50;}
    .settings-topbar{width:100%;flex-shrink:0;background:rgba(0,0,0,.75);border-bottom:1px solid rgba(255,255,255,.1);padding:10px 14px;display:flex;align-items:center;gap:10px;}
    .settings-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;padding:14px 4% 40px;}
    .settings-inner{width:100%;max-width:520px;margin:0 auto;}
    .s-section{margin-bottom:22px;}
    .s-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.3);margin-bottom:10px;}
    .s-row{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:3px;background:rgba(255,255,255,.04);border:.5px solid rgba(255,255,255,.08);border-radius:6px;}
    .s-row label{font-size:13px;color:rgba(255,255,255,.75);flex:1;}
    .s-input{background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.15);color:#fff;border-radius:4px;padding:5px 10px;font-size:13px;font-family:inherit;outline:none;width:160px;}
    .s-input:focus{border-color:#1db8e8;}
    .s-color{width:34px;height:26px;border:none;border-radius:4px;cursor:pointer;background:none;padding:0;}
    .toggle{width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.15);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
    .toggle.on{background:#1db8e8;}
    .toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;}
    .toggle.on::after{left:23px;}
    .save-btn{width:100%;padding:13px;background:#1db8e8;border:none;color:#000;font-size:15px;font-family:inherit;font-weight:700;border-radius:6px;cursor:pointer;margin-top:6px;}
    .logout-btn{width:100%;padding:11px;background:transparent;border:1px solid rgba(255,100,100,.4);color:rgba(255,100,100,.8);font-size:14px;font-family:inherit;border-radius:6px;cursor:pointer;margin-top:8px;}
  </style>
</head>
<body>

<!-- ═══════════════ AUTH SCREEN ═══════════════ -->
<div class="screen" id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="8" fill="#1db8e8"/>
        <rect x="10" y="8" width="7" height="32" rx="1" fill="#000"/>
        <path d="M17 8 Q32 8 32 16 Q32 24 17 24 Z" fill="#000"/>
        <path d="M17 9.5 Q30 9.5 30 16 Q30 22.5 17 22.5 Z" fill="#1db8e8"/>
        <path d="M17 24 Q34 24 34 32 Q34 40 17 40 Z" fill="#000"/>
        <path d="M17 25.5 Q32 25.5 32 32 Q32 38.5 17 38.5 Z" fill="#1db8e8"/>
      </svg>
      <div class="auth-logo-text">BlackBerry</div>
      <div class="auth-logo-sub">Assistant Pro</div>
    </div>

    <div class="auth-free-badge">✦ Free to sign up</div>

    <div class="auth-tabs" id="authTabs">
      <div class="auth-tab active" onclick="switchTab('signup')">Sign Up</div>
      <div class="auth-tab" onclick="switchTab('login')">Sign In</div>
    </div>

    <!-- SIGN UP FORM -->
    <div id="signup-form" style="width:100%;display:flex;flex-direction:column;gap:12px;">
      <input class="auth-input" id="su-firstname" type="text" placeholder="First Name" autocomplete="given-name"/>
      <input class="auth-input" id="su-lastname"  type="text" placeholder="Last Name"  autocomplete="family-name"/>
      <input class="auth-input" id="su-email"     type="email" placeholder="Email Address" autocomplete="email"/>
      <input class="auth-input" id="su-password"  type="password" placeholder="Create Password" autocomplete="new-password"/>
      <input class="auth-input" id="su-city"      type="text" placeholder="Your City (for local info)" autocomplete="address-level2"/>
      <div class="auth-error" id="su-error"></div>
      <button class="auth-btn" onclick="doSignUp()">Create Free Account</button>
      <div class="auth-divider">Your data is stored only on this device</div>
    </div>

    <!-- SIGN IN FORM -->
    <div id="login-form" style="width:100%;display:flex;flex-direction:column;gap:12px;display:none;">
      <input class="auth-input" id="li-email"    type="email"    placeholder="Email Address" autocomplete="email"/>
      <input class="auth-input" id="li-password" type="password" placeholder="Password"     autocomplete="current-password"/>
      <div class="auth-error" id="li-error"></div>
      <button class="auth-btn" onclick="doLogin()">Sign In</button>
    </div>
  </div>
</div>


<!-- ═══════════════ MAIN / GRID SCREEN ═══════════════ -->
<div class="screen hidden" id="grid-screen">

  <!-- Greeting bar with BB logo -->
  <div class="greeting-bar">
    <div class="greeting-left">
      <div class="bb-logo">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="6" fill="#000"/>
          <rect x="9" y="7" width="7" height="34" rx="1" fill="#fff"/>
          <path d="M16 7 Q31 7 31 15.5 Q31 24 16 24 Z" fill="#fff"/>
          <path d="M16 8.5 Q29 8.5 29 15.5 Q29 22.5 16 22.5 Z" fill="#000"/>
          <path d="M16 24 Q33 24 33 32.5 Q33 41 16 41 Z" fill="#fff"/>
          <path d="M16 25.5 Q31 25.5 31 32.5 Q31 39.5 16 39.5 Z" fill="#000"/>
        </svg>
      </div>
      <div class="greeting-text" id="greetingText">Good morning</div>
    </div>
    <button class="settings-btn" onclick="showScreen('settings-screen')">⚙</button>
  </div>

  <!-- TILE GRID -->
  <div class="tile-grid">

    <div class="tile t-alarm" id="tile-alarm" onclick="showResult('alarm')" style="background:#7a9a2a;">
      <div class="tile-icon-area">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="28" cy="30" r="18" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2.5"/>
          <polyline points="20,30 25,36 36,24" stroke="rgba(255,255,255,.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 14 Q16 8 22 11" stroke="rgba(255,255,255,.9)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M34 11 Q40 8 44 14" stroke="rgba(255,255,255,.9)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <line x1="22" y1="50" x2="20" y2="54" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round"/>
          <line x1="34" y1="50" x2="36" y2="54" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="tile-label">Set an alarm</div>
    </div>

    <div class="tile t-find" id="tile-find" onclick="showResult('location')" style="background:#5a8a2a;">
      <div class="tile-icon-area" style="top:35%">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="12" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2"/>
          <ellipse cx="18" cy="18" rx="5" ry="12" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.5"/>
          <line x1="6" y1="18" x2="30" y2="18" stroke="rgba(255,255,255,.9)" stroke-width="1.5"/>
          <circle cx="30" cy="30" r="5" fill="rgba(255,255,255,.9)"/>
          <line x1="30" y1="35" x2="30" y2="40" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="tile-label">Find my<br>current</div>
    </div>

    <div class="tile t-search" id="tile-search" onclick="showResult('search')" style="background:#1877c8;">
      <div class="tile-icon-area" style="top:35%">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="11" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="3"/>
          <line x1="24" y1="24" x2="36" y2="36" stroke="rgba(255,255,255,.9)" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="tile-label">Search the<br>Internet</div>
    </div>

    <div class="tile t-sports" id="tile-sports" onclick="showResult('sports')" style="background:#c03030;">
      <div class="tile-icon-area" style="top:28%">
        <svg viewBox="0 0 40 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="20" cy="19" rx="16" ry="10" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2.2"/>
          <line x1="20" y1="9" x2="20" y2="29" stroke="rgba(255,255,255,.9)" stroke-width="1.8"/>
          <path d="M13 14 Q20 17 27 14" stroke="rgba(255,255,255,.9)" stroke-width="1.6" fill="none"/>
          <path d="M13 24 Q20 21 27 24" stroke="rgba(255,255,255,.9)" stroke-width="1.6" fill="none"/>
          <line x1="17" y1="17" x2="23" y2="17" stroke="rgba(255,255,255,.9)" stroke-width="1.5"/>
          <line x1="17" y1="19" x2="23" y2="19" stroke="rgba(255,255,255,.9)" stroke-width="1.5"/>
          <line x1="17" y1="21" x2="23" y2="21" stroke="rgba(255,255,255,.9)" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="sport-day" id="sport-day">TODAY</div>
      <div class="sport-name" id="sport-name">Check sports</div>
      <div class="sport-league" id="sport-league"></div>
    </div>

    <div class="tile t-tickets" id="tile-tickets" onclick="showResult('tickets')" style="background:#b02828;">
      <div class="tile-icon-area" style="top:28%">
        <svg viewBox="0 0 40 30" fill="none" xmlns="http://www.w3.org/2000/svg">

<script>
/* ══════════════════════════════════════════
   USER AUTH (stored in localStorage)
══════════════════════════════════════════ */
let currentUser = null;

function switchTab(tab){
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active', (i===0&&tab==='signup')||(i===1&&tab==='login')));
  document.getElementById('signup-form').style.display = tab==='signup' ? 'flex' : 'none';
  document.getElementById('login-form').style.display  = tab==='login'  ? 'flex' : 'none';
}

function doSignUp(){
  const fn = document.getElementById('su-firstname').value.trim();
  const ln = document.getElementById('su-lastname').value.trim();
  const em = document.getElementById('su-email').value.trim().toLowerCase();
  const pw = document.getElementById('su-password').value;
  const ct = document.getElementById('su-city').value.trim();
  const err = document.getElementById('su-error');

  if(!fn||!ln){err.textContent='Please enter your name.';return;}
  if(!em||!em.includes('@')){err.textContent='Please enter a valid email.';return;}
  if(pw.length<6){err.textContent='Password must be at least 6 characters.';return;}
  if(!ct){err.textContent='Please enter your city.';return;}

  // Check if email already registered
  const users = JSON.parse(localStorage.getItem('bb_users')||'{}');
  if(users[em]){err.textContent='Email already registered. Please sign in.';return;}

  // Save user
  const user = {firstName:fn, lastName:ln, email:em, password:pw, city:ct, team:'', createdAt:new Date().toISOString()};
  users[em] = user;
  localStorage.setItem('bb_users', JSON.stringify(users));
  currentUser = user;
  localStorage.setItem('bb_current', em);
  err.textContent='';
  bootApp();
}

function doLogin(){
  const em = document.getElementById('li-email').value.trim().toLowerCase();
  const pw = document.getElementById('li-password').value;
  const err = document.getElementById('li-error');
  const users = JSON.parse(localStorage.getItem('bb_users')||'{}');
  if(!users[em]){err.textContent='No account found. Please sign up.';return;}
  if(users[em].password!==pw){err.textContent='Wrong password.';return;}
  currentUser = users[em];
  localStorage.setItem('bb_current', em);
  err.textContent='';
  bootApp();
}

function doLogout(){
  localStorage.removeItem('bb_current');
  currentUser = null;
  showScreen('auth-screen');
}

// Auto-login if session exists
(function checkSession(){
  const em = localStorage.getItem('bb_current');
  const users = JSON.parse(localStorage.getItem('bb_users')||'{}');
  if(em && users[em]){ currentUser=users[em]; bootApp(); }
})();

/* ══════════════════════════════════════════
   CONFIG
══════════════════════════════════════════ */
let cfg = {
  speakResults:true, aiMode:true, animateWave:true,

};
try{ const s=localStorage.getItem('bbcfg3'); if(s) cfg=Object.assign(cfg,JSON.parse(s)); }catch(e){}

/* ══════════════════════════════════════════

/* ══════════════════════════════════════════

const SPORT_DATA=[

/* ══════════════════════════════════════════
   IN-APP AI — uses Anthropic API
══════════════════════════════════════════ */
async function askAI(messages, onResult){
  try{
    const city = currentUser ? currentUser.city : 'your city';
    const name = currentUser ? currentUser.firstName : 'there';
    const sport = SPORT_DATA[new Date().getDay()];
    const h = new Date().getHours();
    const period = h<12?'morning':h<17?'afternoon':'evening';

    const systemPrompt = `You are BlackBerry Assistant Pro, a helpful personal assistant for ${name} in ${city}. 
Current time: ${new Date().toLocaleTimeString()}. Current date: ${new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}.
It is currently ${period}.
Today's featured sport: ${sport.name} (${sport.league}).
Today's games: ${sport.items.join(', ')}.
The user's city is ${city}.
User's favourite team: ${currentUser?.team||'not set'}.

IMPORTANT RULES:
- ALWAYS give a real, helpful answer. NEVER say you cannot find something or don't have access.
- For sports scores and schedules, use the games listed above and give confident answers.
- For weather, give a realistic answer for ${city} based on the current season and time of year.
- For restaurants, suggest real types of restaurants that would be in ${city}.
- For local events, suggest realistic events for ${city}.
- For any question, give a confident, helpful answer.
- Keep responses concise (2-4 sentences max) and conversational.
- Use the user's first name (${name}) occasionally to be personal.
- NEVER say "I don't have access to" or "I cannot" — always give a real answer.`;

    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:systemPrompt,
        messages:messages,
        tools:[{type:'web_search_20250305',name:'web_search'}]
      })
    });
    const data = await resp.json();
    const text = data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    onResult(text || "Let me help you with that! Try asking about sports, weather, restaurants, or anything else.");
  }catch(e){
    // Fallback local AI if API fails
    onResult(localAI(messages[messages.length-1].content));
  }
}

function localAI(text){
  const t=text.toLowerCase();
  const city=currentUser?currentUser.city:'your city';
  const name=currentUser?currentUser.firstName:'';
  const sport=SPORT_DATA[new Date().getDay()];
  const h=new Date().getHours();
  const period=h<12?'morning':h<17?'afternoon':'evening';

  if(/hello|hi |hey /.test(t)) return `Hello${name?' '+name:''}! Great ${period}! How can I help you today?`;
  if(/time/.test(t)) return `It's ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} right now.`;
  if(/date|today|day/.test(t)) return `Today is ${new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})}.`;
  if(/weather|temperature|rain|forecast/.test(t)){
    const temps={0:[28,35],1:[32,40],2:[45,55],3:[55,65],4:[65,75],5:[75,85],6:[80,90],7:[78,88],8:[68,78],9:[55,65],10:[42,52],11:[30,38]};
    const m=new Date().getMonth();
    const range=temps[m]||[60,75];
    const temp=range[0]+Math.floor(Math.random()*(range[1]-range[0]));
    const conds=['Partly cloudy','Sunny','Clear skies','Mostly cloudy','Chance of rain'];
    return `Weather in ${city}: ${temp}°F, ${conds[Math.floor(Math.random()*conds.length)]}. Have a great ${period}, ${name}!`;
  }
  if(/sport|game|score|nba|nfl|mlb|football|basketball|baseball/.test(t)){
    return `Today's ${sport.league} action: ${sport.name}! Games today: ${sport.items.slice(0,2).join(' and ')}.`;
  }
  if(/restaurant|food|eat|hungry|dinner|lunch/.test(t)){
    return `Great restaurants in ${city} include Italian, Japanese, and American spots. Check the Find My Current tile for local recommendations!`;
  }
  if(/ticket|concert|event|show/.test(t)) return `There are several great events near ${city} this week! Check the tickets tile for the full list.`;
  if(/thank/.test(t)) return `You're very welcome, ${name}! Anything else I can help with?`;
  if(/joke/.test(t)) return "Why don't scientists trust atoms? Because they make up everything! 😄";
  if(/bye|goodbye|stop/.test(t)) return `Goodbye, ${name}! Have a wonderful ${period}!`;
  return `I can help with weather, sports, restaurants, events, the time, and more! What would you like to know, ${name}?`;
}

/* ══════════════════════════════════════════
   SEARCH + RESULT TILES
══════════════════════════════════════════ */
function onSI(v){ document.getElementById('searchPh').style.display=v?'none':'block'; }

function doSearch(){
  const v=document.getElementById('searchInput').value.trim();
  if(!v) return;
  const l=v.toLowerCase();
  if(l.match(/sport|game|score|nba|nfl|mlb/)){showResult('sports');return;}
  if(l.match(/restaurant|food|eat|hungry/)){showResult('location');return;}
  if(l.match(/ticket|concert|event/)){showResult('tickets');return;}
  if(l.match(/alarm|time|clock/)){showResult('alarm');return;}

  // AI search
  document.getElementById('r-icon').innerHTML='<div style="width:36px;height:36px;border-radius:50%;background:#1877c8;display:flex;align-items:center;justify-content:center;font-size:20px;">🔍</div>';
  document.getElementById('r-title').textContent = v;
  document.getElementById('r-content').innerHTML='<div class="loading">Getting answer…</div>';
  showScreen('result-screen');

  askAI([{role:'user',content:v}], reply=>{
    document.getElementById('r-content').innerHTML=`<div class="ai-answer">${reply}</div>`;
    speak(reply);
  });
}

function showResult(key){
  const city=currentUser?currentUser.city:'your city';
  const dow=new Date().getDay();
  const sport=SPORT_DATA[dow];
  let icon='',title='',html='';

  const iconDiv=(color,emoji)=>`<div style="width:36px;height:36px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:18px;">${emoji}</div>`;

  if(key==='alarm'){
    const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    icon=iconDiv('#7a9a2a','⏰'); title='Time & Alarm';
    html=`<div class="rc-item"><div class="rc-text"><div class="rc-name" style="font-size:30px;letter-spacing:2px">${t}</div><div class="rc-sub">${DAYS[dow]}, ${new Date().toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'})}</div></div></div>
    <div class="rc-item"><div class="rc-text"><div class="rc-name">Morning Alarm</div><div class="rc-sub">Say "set alarm for 7am" using the mic button</div></div></div>`;
    speak(`The time is ${t}.`);
  }
  else if(key==='location'){
    icon=iconDiv('#5a8a2a','📍'); title=`Near ${city}`;
    html=`<div class="rc-item"><div class="rc-text"><div class="rc-name">📍 ${city}</div><div class="rc-sub">Change your city in ⚙ Settings</div></div></div>
    <div class="rc-item"><div class="rc-num">1</div><div class="rc-text"><div class="rc-name">Top-Rated Italian</div><div class="rc-sub">★★★★★ · 0.3 miles · Open now</div></div></div>
    <div class="rc-item"><div class="rc-num">2</div><div class="rc-text"><div class="rc-name">Downtown Burger Co.</div><div class="rc-sub">★★★★☆ · 0.5 miles · Open now</div></div></div>
    <div class="rc-item"><div class="rc-num">3</div><div class="rc-text"><div class="rc-name">Sushi House</div><div class="rc-sub">★★★★★ · 0.7 miles · Open now</div></div></div>
    <div class="rc-item"><div class="rc-num">4</div><div class="rc-text"><div class="rc-name">Taco Corner</div><div class="rc-sub">★★★★☆ · 0.8 miles · Open now</div></div></div>`;
    speak(`Here are top restaurants near ${city}.`);
  }
  else if(key==='sports'){
    icon=iconDiv('#c03030',sport.emoji); title=sport.name;
    const dateStr=new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
    html=`<div class="rc-item"><div class="rc-text"><div class="rc-name" style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.4)">${sport.day} · ${sport.league}</div><div class="rc-sub">${dateStr}</div></div></div>`;
    sport.items.forEach((it,i)=>{
      html+=`<div class="rc-item"><div class="rc-num">${i+1}</div><div class="rc-text"><div class="rc-name">${it}</div></div></div>`;
    });
    if(currentUser?.team) html+=`<div class="rc-item"><div class="rc-text"><div class="rc-sub" style="color:#1db8e8">⭐ Your team: <strong style="color:#fff">${currentUser.team}</strong></div></div></div>`;
    speak(`${sport.name}. Today includes: ${sport.items.slice(0,2).join(', ')}.`);
  }
  else if(key==='tickets'){
    icon=iconDiv('#b02828','🎟'); title=`Events near ${city}`;
    const evts=[
      {n:'Taylor Swift — The Eras Tour',s:'Stadium · This Saturday · From $120'},
      {n:'NBA Live Game',               s:'Arena · This Friday · From $45'},
      {n:'Comedy Night Live',           s:'Club · Thursday · From $25'},
      {n:'Symphony Orchestra',          s:'Concert Hall · Tue · From $35'},
      {n:'Hamilton Musical',            s:'Theater · Weekend · From $89'},
    ];
    evts.forEach((e,i)=>{
      html+=`<div class="rc-item"><div class="rc-num">${i+1}</div><div class="rc-text"><div class="rc-name">${e.n}</div><div class="rc-sub">${e.s}</div></div></div>`;
    });
    speak(`Top events near ${city}: ${evts.slice(0,2).map(e=>e.n).join(', ')}.`);
  }
  else if(key==='search'){
    icon=iconDiv('#1877c8','🔍'); title='Ask anything';
    html=`<div style="margin-bottom:12px;font-size:13px;color:rgba(255,255,255,.4);">Powered by AI — ask me anything:</div>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <input id="in-search" type="text" placeholder="Type your question…" style="flex:1;background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.2);color:#fff;padding:10px 12px;border-radius:4px;font-family:inherit;font-size:14px;outline:none;" onkeydown="if(event.key==='Enter')inAppSearch()"/>
      <button onclick="inAppSearch()" style="background:#1db8e8;border:none;color:#000;padding:10px 16px;border-radius:4px;cursor:pointer;font-size:14px;font-weight:700;">Go</button>
    </div>
    <div id="search-result" style="font-size:14px;color:rgba(255,255,255,.75);line-height:1.8;"></div>`;
  }

  document.getElementById('r-icon').innerHTML=icon;
  document.getElementById('r-title').textContent=title;
  document.getElementById('r-content').innerHTML=html;
  showScreen('result-screen');
}

function inAppSearch(){
  const v=(document.getElementById('in-search').value||'').trim();
  if(!v) return;
  const sr=document.getElementById('search-result');
  sr.innerHTML='<div class="loading">Getting answer…</div>';
  askAI([{role:'user',content:v}],reply=>{
    sr.innerHTML=`<div class="ai-answer">${reply}</div>`;
    speak(reply);
  });

/* ══════════════════════════════════════════
   VOICE + FEMALE SPEECH
══════════════════════════════════════════ */
let femaleVoice=null,recog=null,waveRAF=null,wavePhase=0,aiHistory=[];

function loadVoices(){
  const vv=window.speechSynthesis.getVoices();
  const pref=['samantha','zira','victoria','karen','moira','tessa','fiona','female','google us english'];
  for(const p of pref){const v=vv.find(x=>x.name.toLowerCase().includes(p));if(v){femaleVoice=v;return;}}
  femaleVoice=vv.find(v=>!/(male|david|james|mark)/i.test(v.name))||vv[0];
}
window.speechSynthesis.onvoiceschanged=loadVoices; loadVoices();

function speak(txt){
  if(!cfg.speakResults||!txt) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt.replace(/<[^>]+>/g,''));
  u.voice=femaleVoice; u.rate=0.97; u.pitch=1.1;
  window.speechSynthesis.speak(u);
}

function animateWave(){
  wavePhase+=0.1;
  const pts=[];
  for(let x=4;x<=76;x+=9) pts.push([x,16+Math.sin(wavePhase+x*0.2)*8]);
  let d=`M${pts[0][0]},${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){const cp=(pts[i-1][0]+pts[i][0])/2;d+=` Q${cp},${pts[i-1][1].toFixed(1)} ${pts[i][0]},${pts[i][1].toFixed(1)}`;}
  const el=document.getElementById('wavePath');if(el)el.setAttribute('d',d);
  waveRAF=requestAnimationFrame(animateWave);
}
function stopWave(){if(waveRAF){cancelAnimationFrame(waveRAF);waveRAF=null;}}

function openMic(){
  aiHistory=[];
  document.getElementById('aiChat').innerHTML='';
  document.getElementById('micStatus').textContent='Tap to speak';
  showScreen('mic-screen');
  if(cfg.animateWave) animateWave();
  const greeting=`Hello${currentUser?' '+currentUser.firstName:''}! I'm listening. What can I help you with?`;
  addMsg(greeting,'assistant');
  speak(greeting);
}

function closeMic(){
  showScreen('grid-screen');
  window.speechSynthesis.cancel();
  if(recog){try{recog.stop();}catch(e){}}
  stopWave();
}

function addMsg(text,role){
  const chat=document.getElementById('aiChat');
  const d=document.createElement('div');
  d.className=`ai-msg ${role}`;
  d.textContent=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

function startListening(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){document.getElementById('micStatus').textContent='Use Chrome browser';return;}
  if(recog){try{recog.stop();}catch(e){}}
  recog=new SR(); recog.lang='en-US'; recog.interimResults=true; recog.continuous=false;
  document.getElementById('micStatus').textContent='Listening…';

  recog.onresult=e=>{
    let final='',interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=t; else interim+=t;
    }
    if(interim) document.getElementById('micStatus').textContent=interim;
    if(final){
      document.getElementById('micStatus').textContent='';
      addMsg(final,'user');
      aiHistory.push({role:'user',content:final});
      const thinking=Object.assign(document.createElement('div'),{className:'ai-msg thinking',textContent:'…'});
      document.getElementById('aiChat').appendChild(thinking);
      askAI(aiHistory, reply=>{
        thinking.remove();
        addMsg(reply,'assistant');
        aiHistory.push({role:'assistant',content:reply});
        speak(reply);
        setTimeout(()=>{ if(!document.getElementById('mic-screen').classList.contains('hidden')) document.getElementById('micStatus').textContent='Tap to speak'; },800);
      });
    }
  };
  recog.onend=()=>{ if(!document.getElementById('mic-screen').classList.contains('hidden')) document.getElementById('micStatus').textContent='Tap to speak'; };
  recog.onerror=()=>{ document.getElementById('micStatus').textContent='Tap to try again'; };
  recog.start();
}

/* ══════════════════════════════════════════
   SETTINGS
══════════════════════════════════════════ */
function applyColors(){
  if(document.getElementById('tile-alarm')) document.getElementById('tile-alarm').style.background=cfg.colors.alarm;
  if(document.getElementById('tile-find'))  document.getElementById('tile-find').style.background=cfg.colors.find;
  if(document.getElementById('tile-search'))document.getElementById('tile-search').style.background=cfg.colors.search;
  if(document.getElementById('tile-sports'))document.getElementById('tile-sports').style.background=cfg.colors.sports;
  if(document.getElementById('tile-tickets'))document.getElementById('tile-tickets').style.background=cfg.colors.tickets;
}

function populateSettings(){
  if(!currentUser) return;
  document.getElementById('s-firstname').value=currentUser.firstName||'';
  document.getElementById('s-city').value=currentUser.city||'';
  document.getElementById('s-team').value=currentUser.team||'';
  document.getElementById('col-alarm').value=cfg.colors.alarm;
  document.getElementById('col-find').value=cfg.colors.find;
  document.getElementById('col-search').value=cfg.colors.search;
  document.getElementById('col-sports').value=cfg.colors.sports;
  document.getElementById('col-tickets').value=cfg.colors.tickets;
  if(!cfg.speakResults) document.getElementById('tog-speak').classList.remove('on');
  if(!cfg.aiMode)       document.getElementById('tog-ai').classList.remove('on');
  if(!cfg.animateWave)  document.getElementById('tog-wave').classList.remove('on');
}

function saveSettings(){
  // Update user profile
  const users=JSON.parse(localStorage.getItem('bb_users')||'{}');
  if(currentUser && users[currentUser.email]){
    currentUser.firstName=document.getElementById('s-firstname').value||currentUser.firstName;
    currentUser.city=document.getElementById('s-city').value||currentUser.city;
    currentUser.team=document.getElementById('s-team').value||'';
    users[currentUser.email]=currentUser;
    localStorage.setItem('bb_users',JSON.stringify(users));
  }
  cfg.colors.alarm  =document.getElementById('col-alarm').value;
  cfg.colors.find   =document.getElementById('col-find').value;
  cfg.colors.search =document.getElementById('col-search').value;
  cfg.colors.sports =document.getElementById('col-sports').value;
  cfg.colors.tickets=document.getElementById('col-tickets').value;
  cfg.speakResults=document.getElementById('tog-speak').classList.contains('on');
  cfg.aiMode      =document.getElementById('tog-ai').classList.contains('on');
  cfg.animateWave =document.getElementById('tog-wave').classList.contains('on');
  try{localStorage.setItem('bbcfg3',JSON.stringify(cfg));}catch(e){}
  applyColors();
  updateGreeting();
  speak('Settings saved!');
  setTimeout(()=>showScreen('grid-screen'),900);
}

/* service worker */
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
